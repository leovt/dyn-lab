<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rod diagrams</title>
  <script src="https://cdn.plot.ly/plotly-4.1.1.min.js" charset="utf-8" defer></script>
  <script src="rod.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background: #f3f5f8;
      color: #172333;
      font: 1rem system-ui, sans-serif;
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: 1.5rem;
      font-weight: 600;
    }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    section {
      min-width: 0;
      overflow: hidden;
      background: white;
      border: 1px solid #d9e0e8;
      border-radius: .5rem;
    }

    h2 {
      margin: 0;
      padding: 1rem 1rem 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 2rem;
      margin: 0 0 1rem;
      padding: .75rem 1rem;
      background: white;
      border: 1px solid #d9e0e8;
      border-radius: .5rem;
    }

    .control {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .control label {
      font-weight: 600;
      font-size: .875rem;
    }

    .control input[type="range"] {
      width: 12rem;
    }

    .control output {
      min-width: 4.5ch;
      text-align: right;
      color: #4c5b6b;
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
    }

    .plot {
      width: 100%;
      height: max(340px, 39vh);
    }

    svg.phase {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      background: #ffffff;
    }

    svg.plot {
      display: block;
      background: #ffffff;
    }

    .note {
      margin: 0;
      padding: 0 1rem 1rem;
      color: #4c5b6b;
      font-size: .875rem;
    }

    @media (max-width: 760px) {
      body {
        padding: 1rem;
      }

      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>Rod diagrams</h1>
  <div class="controls" role="group" aria-label="Parameter controls">
    <div class="control">
      <label for="lambda-slider">λ</label>
      <input type="range" id="lambda-slider" min="-2" max="4" step="0.01" value="2.0">
      <output id="lambda-value" for="lambda-slider">2.00</output>
    </div>
    <div class="control">
      <label for="x0-slider">x₀</label>
      <input type="range" id="x0-slider" min="-4" max="4" step="0.01" value="0.2">
      <output id="x0-value" for="x0-slider">0.20</output>
    </div>
    <div class="control">
      <label for="gamma-slider">γ</label>
      <input type="range" id="gamma-slider" min="0" max="3" step="0.01" value="0">
      <output id="gamma-value" for="gamma-slider">0.00</output>
    </div>
  </div>
  <main>
    <section aria-labelledby="equilibrium-title">
      <h2 id="equilibrium-title">Equilibrium surface</h2>
      <div id="equilibrium" class="plot" role="img"
        aria-label="3D equilibrium surface x0 = x minus lambda times sine of x, for x from -3 to 3 and lambda from -2 to 4">
      </div>
      <p class="note">x₀ = x − λ sin(x), x ∈ [−3, 3], λ ∈ [−2, 4].</p>
    </section>
    <section aria-labelledby="bifurcation-title">
      <h2 id="bifurcation-title">Bifurcation diagram</h2>
      <div id="bifurcation" class="plot" role="img"
        aria-label="Bifurcation diagram for x0 = -1.0 in orange, 0 in blue, and 0.5 in red; lambda from -2 to 4 horizontally and x from -3 to 3 vertically"></div>
    </section>
    <section aria-labelledby="phase-title">
      <h2 id="phase-title">Phase diagram</h2>
      <svg class="phase" role="img" viewBox="0 0 30 20" preserveAspectRatio="xMidYMid meet"
        aria-label="Phase diagram vector field, x horizontally and x dot vertically; arrows point along the damped flow">
        <defs>
          <g id="arrow">
            <path d="M -0.5 0.05 L -0.5 -0.05 0.3 -0.05 0.2 -0.2 0.5 0 0.2 0.2 0.3 0.05 Z" fill="#9aa4b0" />
          </g>
        </defs>
        <g id="phase-plot-area" transform="scale(1,-1)translate(0,-20)"></g>
        <!-- Problem-unit frame: children draw in data (x, v) units, 1 unit = 5
             grid units, origin at the frame center (15, 10), v up. Matches the
             arrow grid: grid_x = 15 + 5x, grid_y = 10 - 5v. -->
        <g id="phase-plot-area-to-scale" transform="translate(15,10) scale(5,-5)">
          <path d="" id="phase-trajectory" fill="none" stroke="#007acc" stroke-width="0.04" />
          <circle id="phase-tracker" r="0.04" cx="999" cy="0.6" fill="white" stroke="#007acc" stroke-width="0.04" />
        </g>

      </svg>
    </section>
    <section aria-labelledby="physical-title">
      <h2 id="physical-title">Physical representation</h2>
      <!-- Square coordinate system, [-1.2, 1.2] both axes: 100 svg units per
           data unit, origin at (150, 150), y up. preserveAspectRatio keeps the
           system square at any panel aspect ratio (letterboxed if needed). -->
      <svg class="plot" role="img" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet"
        aria-label="Physical representation: rod with pivot on a tilted floor, sine of x horizontally and cosine of x vertically">
        <defs>
          <clipPath id="floor-clip">
            <rect x="-0.5" y="-0.3" width="1" height="0.3" />
          </clipPath>
        </defs>
        <g stroke="#8a97a5" stroke-width="1">
          <line x1="24" y1="150" x2="276" y2="150" />
          <line x1="150" y1="276" x2="150" y2="24" />
          <line x1="50" y1="150" x2="50" y2="155" />
          <line x1="100" y1="150" x2="100" y2="155" />
          <line x1="150" y1="150" x2="150" y2="155" />
          <line x1="200" y1="150" x2="200" y2="155" />
          <line x1="250" y1="150" x2="250" y2="155" />
          <line x1="145" y1="50" x2="150" y2="50" />
          <line x1="145" y1="100" x2="150" y2="100" />
          <line x1="145" y1="150" x2="150" y2="150" />
          <line x1="145" y1="200" x2="150" y2="200" />
          <line x1="145" y1="250" x2="150" y2="250" />
        </g>
        <g fill="#4c5b6b" font-family="system-ui, sans-serif" font-size="11">
          <text x="50" y="169" text-anchor="middle">-1</text>
          <text x="100" y="169" text-anchor="middle">-0.5</text>
          <text x="150" y="169" text-anchor="middle">0</text>
          <text x="200" y="169" text-anchor="middle">0.5</text>
          <text x="250" y="169" text-anchor="middle">1</text>
          <text x="141" y="54" text-anchor="end">1</text>
          <text x="141" y="104" text-anchor="end">0.5</text>
          <text x="141" y="154" text-anchor="end">0</text>
          <text x="141" y="204" text-anchor="end">-0.5</text>
          <text x="141" y="254" text-anchor="end">-1</text>
        </g>
        <text x="150" y="291" text-anchor="middle" fill="#172333"
          font-family="system-ui, sans-serif" font-size="13">sin x</text>
        <text x="12" y="150" text-anchor="middle" fill="#172333"
          font-family="system-ui, sans-serif" font-size="13"
          transform="rotate(-90 12 150)">cos x</text>
        <!-- Data-coordinate frame: origin at (150,150), 1 data unit = 100 units,
             y up. Because of the y flip, child rotate(θ) is a CCW math angle
             about the data origin. Unwired placeholders use rotate(0). -->
        <g transform="translate(150 150) scale(100,-100)">
          <!-- Floor: hatched rectangle below y=0, rotated by x0 radians when
               wired (transform="rotate(x0 * 180 / Math.PI)"). Drawn before the
               rod so the rod sits on top. -->
          <g id="floor-group" transform="rotate(0)">
            <rect x="-0.5" y="-0.3" width="1" height="0.3" fill="#ffffff" />
            <path clip-path="url(#floor-clip)" fill="none" stroke="#172333" stroke-width="0.02"
              d="M -0.8 -0.3 L -1.1 0 M -0.7 -0.3 L -1.0 0 M -0.6 -0.3 L -0.9 0 M -0.5 -0.3 L -0.8 0 M -0.4 -0.3 L -0.7 0 M -0.3 -0.3 L -0.6 0 M -0.2 -0.3 L -0.5 0 M -0.1 -0.3 L -0.4 0 M 0 -0.3 L -0.3 0 M 0.1 -0.3 L -0.2 0 M 0.2 -0.3 L -0.1 0 M 0.3 -0.3 L 0 0 M 0.4 -0.3 L 0.1 0 M 0.5 -0.3 L 0.2 0 M 0.6 -0.3 L 0.3 0 M 0.7 -0.3 L 0.4 0 M 0.8 -0.3 L 0.5 0" />
            <line x1="-0.5" y1="0" x2="0.5" y2="0" stroke="#172333" stroke-width="0.03" />
          </g>
          <!-- Rod: grey beam from the origin axis; rotate by the rod angle x
               later (transform="rotate(x * 180 / Math.PI)"). -->
          <g id="rod-group" transform="rotate(0)">
            <rect x="-0.2" y="-0.2" width="0.4" height="1.4" fill="#9aa4b0"
              stroke="#172333" stroke-width="0.02" />
          </g>
          <!-- Pivot axis, on top of the rod, rotation-independent. -->
          <circle cx="0" cy="0" r="0.07" fill="#ffffff" stroke="#172333" stroke-width="0.03" />
        </g>
      </svg>
      <p class="note">Angle convention: (sin x, cos x); zero points upward.</p>
    </section>
  </main>
  <noscript>Enable JavaScript to display the Plotly frames.</noscript>
</body>

</html>
